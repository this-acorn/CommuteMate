spring.application.name=CommuteMate

server.port=${PORT:8080}

# Disable template caching so HTML/CSS edits show up without a restart during development
spring.thymeleaf.cache=false

# Epic 1: where user accounts live.
#
# The defaults below are the local development database: a file-based H2 under
# ./data. Deployments override them with environment variables, because Render
# rebuilds the container filesystem on every deploy, restart, and wake-up from
# an idle spin-down — an H2 file inside the container is deleted every time,
# which is why registered accounts kept disappearing.
#
# On Render, set these three environment variables from the managed Postgres
# instance. Render's dashboard shows an "Internal Database URL" that looks like
#     postgresql://USER:PASSWORD@HOST/DATABASE
# which is NOT a JDBC URL — rewrite it by hand as:
#     SPRING_DATASOURCE_URL=jdbc:postgresql://HOST/DATABASE
#     SPRING_DATASOURCE_USERNAME=USER
#     SPRING_DATASOURCE_PASSWORD=PASSWORD
# The driver is inferred from the URL, so it must not be pinned here.
spring.datasource.url=jdbc:h2:file:./data/commutemate
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Epic 1: keep the logged-in session in the database rather than in Tomcat's
# memory, so a redeploy or a wake-up from Render's idle spin-down no longer
# signs everyone out.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
# Stay signed in for a week of inactivity; the remember-me cookie below covers
# the gap after that.
spring.session.timeout=7d

# Epic 1: signs the "Keep me signed in" cookie. The literal default is for local
# development only — deployments must set REMEMBER_ME_KEY to a long random
# string, and must keep the same value across deploys, or every outstanding
# cookie is invalidated.
app.remember-me.key=${REMEMBER_ME_KEY:commutemate-local-dev-remember-me-key}

# SFU's local time zone.
app.time-zone=${APP_TIME_ZONE:America/Vancouver}


# for demo
app.seed-demo-data=${SEED_DEMO_DATA:true}

#epic2: TransLink real-time transit API key
# (set TRANSLINK_API_KEY locally and in Render's environment settings; never commit the key)
translink.api.key=${TRANSLINK_API_KEY:}
# epic2: which stops we watch lives in TransitStops.java — the bus bays next to each SFU
# campus never change, so they are code rather than config.

# epic2: TransLink and Open-Meteo are third parties, so never let a slow response hold a
# dashboard request thread open. Without these a hung connection never throws and the page
# just stops loading instead of showing the "temporarily unavailable" / missing card. These
# only apply to the auto-configured RestClient.Builder, which is why the services must not
# use RestClient.create(). The rider dashboard makes several calls in sequence, so worst
# case adds connect+read per call before the cards fall back.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s

# epic2: cache the current weather so dashboard reloads don't call the API every time.
# Open-Meteo only refreshes its model output every ~15 minutes anyway.
spring.cache.cache-names=weather
spring.cache.caffeine.spec=expireAfterWrite=10m
