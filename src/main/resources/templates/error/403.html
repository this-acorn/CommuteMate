<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied — CommuteMate',
  'You do not have permission to open this CommuteMate page.')}"></head>
<body>
<div class="min-h-screen bg-mountain-gradient">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-10">
    <section class="w-full rounded-2xl border border-border bg-card p-8 text-center card-lift">
      <div class="mx-auto grid h-10 w-10 place-items-center rounded-2xl bg-destructive/10 text-destructive">
        <span class="font-display text-lg font-semibold">403</span>
      </div>
      <h1 class="mt-6 font-display text-3xl font-semibold tracking-tight">Access denied</h1>
      <p class="mx-auto mt-3 max-w-md text-sm text-muted-foreground">
        Your account does not have permission to use this page or action.
      </p>
      <div class="mt-6 flex justify-center">
        <a th:href="@{/}"
           class="inline-flex h-10 items-center justify-center rounded-md bg-primary px-6 text-sm font-medium text-primary-foreground shadow hover:bg-primary/90">
          Return to CommuteMate
        </a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
