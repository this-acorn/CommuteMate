<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ride chat — CommuteMate',
  'Coordinate pickup details with confirmed CommuteMate ride participants.')}"></head>
<body>
<div class="min-h-screen bg-background">
  <th:block th:if="${chat.owner}">
    <header th:replace="~{fragments/layout :: nav('drive')}"></header>
  </th:block>
  <th:block th:unless="${chat.owner}">
    <header th:replace="~{fragments/layout :: nav('ride')}"></header>
  </th:block>

  <main class="mx-auto max-w-5xl px-6 py-10">
    <a th:href="@{/rides/{id}(id=${chat.ride.id})}"
       class="text-sm text-muted-foreground hover:text-foreground">← Back to ride details</a>

    <div th:if="${successMessage}"
         class="mt-5 rounded-xl bg-emerald-500/10 px-4 py-3 text-sm font-medium text-emerald-800"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"
         class="mt-5 rounded-xl bg-destructive/10 px-4 py-3 text-sm font-medium text-destructive"
         th:text="${errorMessage}"></div>

    <div class="mt-6">
      <section class="mx-auto max-w-4xl rounded-2xl border border-border bg-card p-6 card-lift">
        <div class="flex flex-wrap items-start justify-between gap-4 border-b border-border" style="padding-bottom: 1.25rem;">
          <div>
            <p class="text-sm font-medium text-primary">Ride conversation</p>
            <h1 class="mt-1 font-display text-2xl font-semibold tracking-tight"
                th:text="${chat.ride.from + ' → ' + chat.ride.to}">Metrotown → SFU Burnaby</h1>
            <p class="mt-1 text-sm text-muted-foreground"
               th:text="${chat.ride.departDate + ' · ' + chat.ride.departTime}">Jul 25, 2026 · 8:00 AM</p>
          </div>
          <span class="rounded-full bg-secondary px-3 py-1 text-xs font-medium"
                th:text="${chat.owner ? 'Driver' : 'Confirmed rider'}">Confirmed rider</span>
        </div>

        <div id="chat-thread" class="chat-thread mt-5 rounded-xl bg-secondary/60 p-4">
          <div th:if="${#lists.isEmpty(chat.messages)}" class="py-10 text-center">
            <p class="font-medium">No messages yet.</p>
            <p class="mt-1 text-sm text-muted-foreground">Start the conversation with a pickup or timing update.</p>
          </div>

          <div th:unless="${#lists.isEmpty(chat.messages)}" class="space-y-3">
            <article th:each="message : ${chat.messages}"
                     class="chat-message rounded-xl border border-border bg-card px-4 py-3"
                     th:classappend="${message.mine} ? ' chat-message-mine border-primary/30 bg-primary/5' : ''">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <p class="text-sm font-semibold" th:text="${message.mine ? 'You' : message.senderName}">You</p>
                  <p class="text-xs text-muted-foreground" th:text="${message.senderEmail}">rider@sfu.ca</p>
                </div>
                <time class="text-xs text-muted-foreground" th:text="${message.sentAt}">Jul 23, 1:10 AM</time>
              </div>
              <p class="chat-message-body mt-2 text-sm" th:text="${message.body}">I will wait near the east entrance.</p>
            </article>
          </div>
        </div>

        <form method="post" th:action="@{/rides/{id}/chat/messages(id=${chat.ride.id})}" class="chat-compose mt-4">
          <div class="chat-compose-bar">
            <label for="message" class="sr-only">New message</label>
            <textarea id="message" name="message" required="required" rows="1"
                      th:attr="maxlength=${maxMessageLength}"
                      placeholder="Message"></textarea>
            <button type="submit"
                    class="chat-send-button inline-flex items-center justify-center bg-primary text-sm font-medium text-primary-foreground hover:bg-primary/90">
              Send
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var thread = document.getElementById("chat-thread");
    var message = document.getElementById("message");

    if (thread) {
      thread.scrollTop = thread.scrollHeight;
    }

    if (message) {
      var resizeMessageBox = function () {
        message.style.height = "auto";
        message.style.height = Math.min(message.scrollHeight, 128) + "px";
      };

      message.addEventListener("input", resizeMessageBox);
      message.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (message.value.trim()) {
            message.form.requestSubmit();
          }
        }
      });

      resizeMessageBox();
    }
  });
</script>
</body>
</html>
